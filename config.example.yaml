# Toggled application configuration.
# Copy this file to config.yaml and adjust values for your environment.
# config.yaml is gitignored and must not be committed.
#
#   cp config.example.yaml config.yaml

# Runtime environment. Controls log encoding and can grow other
# environment-specific behaviour later.
#   local        - human-readable console logs
#   production   - JSON structured logs
env: local

http:
  # TCP port the API server listens on.
  port: 8080

# Database backend. `type` selects which nested block is used.
# To add another engine later, introduce a new type and a sibling block:
#
#   database:
#     type: mysql
#     mysql:
#       url: user:pass@tcp(localhost:3306)/toggled
database:
  type: postgres
  # The DATABASE_URL environment variable overrides this value when set.
  postgres:
    url: postgres://toggled:toggled@localhost:5432/toggled?sslmode=disable

log:
  # debug | info | warn | error
  # debug also forces console encoding, even when env is production.
  level: info
